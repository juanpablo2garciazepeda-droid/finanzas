# Finanzas GZ — API (Dokploy Compose)
#
# IMPORTANTE — cómo debe quedar configurado el servicio en Dokploy:
#   Provider / Source Type : GitHub (o Git), NO "Raw".
#   Repositorio            : juanpablo2garciazepeda-droid/finanzas
#   Branch                 : main
#   Compose Path           : apps/backend/docker-compose.dokploy.yml
#
# Con "Raw" Dokploy solo escribe un docker-compose.yml en
# /etc/dokploy/compose/<app>/code/ y NO clona el repo, así que cualquier
# `build.context` que apunte al código revienta con:
#   lstat /etc/dokploy/compose/finanzas-gz-backend/code/apps: no such file or directory
#
# El `context: .` de abajo se resuelve contra la carpeta de ESTE archivo
# (apps/backend), no contra la raíz del repo. Si mueves el archivo, ajústalo.
#
# Las variables con `:?` son obligatorias: si faltan en la pestaña
# Environment de Dokploy el despliegue falla antes de construir.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: finanzas-gz-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_HOST: ${DATABASE_HOST:?DATABASE_HOST is required}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_USER: ${DATABASE_USER:?DATABASE_USER is required}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      DATABASE_NAME: ${DATABASE_NAME:-finanzas}
      # Activa el runner de migraciones SQL (src/migraciones.ts) en cada
      # arranque. Es idempotente: registra las aplicadas en
      # `public.schema_migrations` y solo corre las nuevas. Sin esto, un
      # push que toque columnas/tablas cae la app hasta que alguien corra
      # el SQL a mano (ya no tenemos acceso al contenedor de Postgres).
      MIGRACIONES_AUTOMATICAS: ${MIGRACIONES_AUTOMATICAS:-true}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30d}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://finanzasgz.com.mx}
      APP_URL: ${APP_URL:-https://finanzasgz.com.mx}
      EMAIL_MODE: ${EMAIL_MODE:-console}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Finanzas GZ <no-reply@finanzasgz.com.mx>}
    networks:
      - dokploy-network
      - default
    labels:
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.finanzas-gz-api.rule=Host(`api.finanzasgz.com.mx`)
      - traefik.http.routers.finanzas-gz-api.entrypoints=web
      - traefik.http.routers.finanzas-gz-api.service=finanzas-gz-api-svc
      - traefik.http.routers.finanzas-gz-api.middlewares=redirect-to-https@file
      - traefik.http.services.finanzas-gz-api-svc.loadbalancer.server.port=3000
      - traefik.http.routers.finanzas-gz-apisecure.rule=Host(`api.finanzasgz.com.mx`)
      - traefik.http.routers.finanzas-gz-apisecure.entrypoints=websecure
      - traefik.http.routers.finanzas-gz-apisecure.service=finanzas-gz-apisecure-svc
      - traefik.http.routers.finanzas-gz-apisecure.tls.certresolver=letsencrypt
      - traefik.http.services.finanzas-gz-apisecure-svc.loadbalancer.server.port=3000
      - traefik.enable=true
networks:
  dokploy-network:
    external: true
